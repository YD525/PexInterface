name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-analysis:
    name: Restore, build, test, and analyze
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore pinned native dependency
        shell: pwsh
        run: .\scripts\Restore-Dependencies.ps1

      - name: Verify native dependency checksum and ABI
        shell: pwsh
        run: .\scripts\Test-NativeDependency.ps1

      - name: Build and run Roslyn analyzers
        shell: pwsh
        run: .\scripts\Invoke-Build.ps1 -Configuration Release -Platform x64

      - name: Verify changed API documentation
        shell: pwsh
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $baseRef = if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
              $env:PULL_REQUEST_BASE_SHA
          }
          else {
              "HEAD^"
          }
          .\scripts\Test-ChangedApiDocumentation.ps1 -BaseRef $baseRef

      - name: Run managed/native integration tests
        shell: pwsh
        run: .\scripts\Run-Tests.ps1 -Configuration Release -Platform x64 -ResultsDirectory .ci-artifacts\tests

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: managed-test-results
          path: .ci-artifacts/tests
          if-no-files-found: ignore
          retention-days: 14
