name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore native dependency
        shell: pwsh
        run: .\scripts\Restore-Dependencies.ps1

      - name: Build x64 release
        shell: pwsh
        run: msbuild .\PexInterface.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Create checksum
        shell: pwsh
        run: |
          $artifact = ".\PexInterface\bin\x64\Release\PexInterface.dll"
          if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Release artifact was not produced: $artifact"
          }

          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PexInterface.dll" | Set-Content "$artifact.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            ".\PexInterface\bin\x64\Release\PexInterface.dll" `
            ".\PexInterface\bin\x64\Release\PexInterface.dll.sha256" `
            --generate-notes `
            --verify-tag
